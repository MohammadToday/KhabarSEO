name: Bug report
description: Something does not work as described
labels: [ bug ]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: "Paste the output of KhabarSEO, Status, Copy diagnostics. It contains no URLs or secrets."
      render: text
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: PHP errors (optional)
      description: Relevant lines from debug.log with WP_DEBUG_LOG enabled.
      render: text
