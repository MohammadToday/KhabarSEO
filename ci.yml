name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-smoke:
    name: Lint and smoke tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.2', '8.3', '8.4', '8.5' ]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, intl
          coverage: none
          ini-values: error_reporting=-1, display_errors=On
      - name: Lint every PHP file
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Smoke tests (no deprecations allowed)
        run: php tests/smoke.php

  phpcs:
    name: WordPress Coding Standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpcs
      - name: PHP 8.1 to 8.5 compatibility sniffs
        run: composer compat

  i18n:
    name: Translations are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: POT is current
        run: |
          php bin/make-pot.php
          git diff --exit-code languages/khabar-seo.pot
      - name: Every .po fully translated and .mo current
        run: |
          php bin/build-mo.php
          git diff --exit-code -- languages/
