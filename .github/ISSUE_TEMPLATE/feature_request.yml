name: Feature request
description: Suggest an improvement for news publishers
labels: [ enhancement ]
body:
  - type: textarea
    id: problem
    attributes:
      label: Which problem does a news publisher have today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Official source (for Google or other search engine behavior)
      description: Link the documentation page this is based on. Features without a source stay behind a setting.
